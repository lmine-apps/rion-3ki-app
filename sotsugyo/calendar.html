<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>カレンダーに登録｜凛穏塾 3期生 卒業式</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="凛穏塾 卒業式">
<meta name="theme-color" content="#07172c">
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body class="js-fade">

<header class="head">
  <div class="head__inner">
    <p class="kicker" data-ev="kicker">RION JUKU / GRADUATION</p>
    <h1 class="head__title" data-ev="name">凛穏塾 3期生 卒業式</h1>
    <p class="head__sub" data-ev="date">—</p>
  </div>
</header>

<main class="wrap">

  <section class="screen is-active">
    <div class="card card--done">
      <h2 class="card__title" id="cal-title">お申し込みありがとうございました</h2>
      <p class="donelead">当日の予定を、お手持ちのカレンダーに入れておくことができます。</p>

      <div id="cal-list"></div>

      <p class="note" id="cal-help">
        ボタンを押すと、カレンダーのアプリが開きます。<br>
        うまく開かないときは、画面右上（または右下）の「ブラウザで開く」からお試しください。
      </p>
    </div>
  </section>

</main>

<footer class="foot">
  <img class="foot__logo" src="assets/logo-light-320.png" alt="凛穏塾" width="54">
  <p>凛穏塾</p>
  <p class="foot__links">
    <a id="link-tokusho" href="#" target="_blank" rel="noopener">特定商取引法に基づく表記</a>
    <a id="link-privacy" href="#" target="_blank" rel="noopener">プライバシーポリシー</a>
  </p>
</footer>

<script src="js/config.js?v=4"></script>
<script src="js/calendar.js?v=4"></script>
</body>
</html>
