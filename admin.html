<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>受付管理｜凛穏塾 3期生</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest-admin.json">
<meta name="theme-color" content="#12345a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="3期 受付管理">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  :root{
    --ground:#eaf4fb; --card:#fff; --card-soft:#f4fafd;
    --ink:#172b3d; --ink-soft:#5f7387; --ink-faint:#93a6b6;
    --line:#d5e4ef; --navy:#12345a; --navy-dk:#0b203d; --sky:#62b7e7; --sky-soft:#e5f5fd;
    --green:#1f7a5c; --green-soft:#e6f3ee; --warn:#c0503f; --warn-soft:#fdf0ed;
    --amber:#a8722a; --amber-soft:#fdf3e3; --gold:#a8823f;
    --mark-bg:#12345a; --on-mark:#fff; --scrim:rgba(11,32,61,.45);
    --shadow:0 10px 30px rgba(7,23,44,.13);
    --serif:"Yu Mincho",YuMincho,"Hiragino Mincho ProN","Noto Serif JP",serif;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",YuGothic,Meiryo,system-ui,sans-serif;
    --num:Georgia,"Times New Roman",serif;
    --mono:Consolas,"Cascadia Mono",ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#07172a; --card:#0e2338; --card-soft:#142a41;
      --ink:#e6eef5; --ink-soft:#9db1c3; --ink-faint:#6b8299;
      --line:#22405c; --navy:#9fc9e8; --navy-dk:#cfe6f6; --sky:#62b7e7; --sky-soft:#10293d;
      --green:#6cc39f; --green-soft:#102b23; --warn:#e0917f; --warn-soft:#33201c;
      --amber:#d9a559; --amber-soft:#2e2314; --gold:#d1a95f;
      --mark-bg:#62b7e7; --on-mark:#06182a; --scrim:rgba(0,0,0,.6);
      --shadow:0 10px 30px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --ground:#07172a; --card:#0e2338; --card-soft:#142a41;
    --ink:#e6eef5; --ink-soft:#9db1c3; --ink-faint:#6b8299;
    --line:#22405c; --navy:#9fc9e8; --navy-dk:#cfe6f6; --sky:#62b7e7; --sky-soft:#10293d;
    --green:#6cc39f; --green-soft:#102b23; --warn:#e0917f; --warn-soft:#33201c;
    --amber:#d9a559; --amber-soft:#2e2314; --gold:#d1a95f;
    --mark-bg:#62b7e7; --on-mark:#06182a; --scrim:rgba(0,0,0,.6);
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }

  body{background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.75;font-size:15px}
  button{font-family:inherit;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}

  /* ---------- header ---------- */
  .head{background:linear-gradient(160deg,var(--navy-dk),var(--navy));color:#fff}
  :root:not([data-theme="light"]) .head,:root[data-theme="dark"] .head{background:linear-gradient(160deg,#061626,#12385c)}
  .head__in{max-width:1000px;margin:0 auto;padding:.9rem 1rem 1rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
  .head__t{display:flex;flex-direction:column;gap:0;margin-right:auto}
  .head__k{font-size:.62rem;letter-spacing:.3em;color:var(--sky)}
  .head__n{font-family:var(--serif);font-size:1.15rem;line-height:1.3}
  .head button{
    font-size:.8rem;font-weight:700;cursor:pointer;border:1.3px solid rgba(255,255,255,.45);
    background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:.35rem .95rem;
  }
  .head button:hover{background:rgba(255,255,255,.2)}
  #btn-push{position:relative;padding:.35rem .7rem;font-size:.95rem;line-height:1}
  #btn-push.on::after{content:'';position:absolute;top:.25rem;right:.35rem;width:.45rem;height:.45rem;
    border-radius:50%;background:#6ee7a8;box-shadow:0 0 0 2px var(--navy-dk)}
  .pushlist{display:flex;flex-direction:column;gap:.15rem;margin:.6rem 0 0}
  .pushrow{display:flex;align-items:flex-start;gap:.6rem;padding:.55rem .2rem;
    border-bottom:1px solid var(--line);cursor:pointer}
  .pushrow:last-child{border-bottom:0}
  .pushrow input{margin:.15rem 0 0;width:1.1rem;height:1.1rem;flex:none;accent-color:var(--navy)}
  .pushrow b{display:block;font-size:.9rem;font-weight:700;color:var(--ink)}
  .pushrow em{display:block;font-style:normal;font-size:.76rem;color:var(--ink-soft);margin-top:.1rem}
  .lnk{background:none;border:0;padding:0;font:inherit;color:var(--navy);
    font-weight:700;text-decoration:underline;cursor:pointer}
  .pushdiag{border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .pushdiag__r{display:flex;justify-content:space-between;gap:1rem;align-items:center;
    padding:.5rem .7rem;font-size:.82rem;border-bottom:1px solid var(--line)}
  .pushdiag__r:last-child{border-bottom:0}
  .pushdiag__r b{font-size:.78rem;white-space:nowrap}
  .pushdiag__r b.ok{color:var(--green)}
  .pushdiag__r b.ng{color:var(--warn)}
  .flag{font-size:.68rem;font-weight:700;padding:.15rem .6rem;border-radius:999px;background:#fbe9e7;color:#9c3a28}
  .flag.dry{background:#fdf3dd;color:#8a6a1e}
  .flag.test{background:#b25c17;color:#fff}
  .flag.gate{background:#1f6f8b;color:#fff}

  /* ---------- スイッチ（テスト決済／受付の開け閉め） ---------- */
  .switches{display:flex;flex-direction:column;gap:.6rem;
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem}
  .sw{display:flex;align-items:flex-start;gap:1rem;justify-content:space-between}
  .sw+.sw{border-top:1px dashed var(--line);padding-top:.7rem}
  .sw__t{display:flex;flex-direction:column;gap:.15rem;min-width:0}
  .sw__t>b{font-size:.9rem}
  .sw__d{font-size:.76rem;color:var(--ink-soft);line-height:1.7}
  .sw__d b{color:var(--ink)}
  .swbtn{flex:none;min-width:5.4rem;padding:.42rem .9rem;border-radius:999px;cursor:pointer;
    border:1.5px solid var(--line);background:var(--card-soft);color:var(--ink-soft);
    font-size:.82rem;font-weight:700;transition:background .15s,color .15s,border-color .15s}
  .swbtn:hover{border-color:var(--ink-faint)}
  /* オンのあいだは赤。ひと目で「ふだんと違う」と分かるように */
  .swbtn[aria-pressed="true"]{background:#c0392b;border-color:#c0392b;color:#fff}
  .swbtn:disabled{opacity:.5;cursor:progress}
  /* ---------- コース選び ---------- */
  .plancho{display:flex;flex-direction:column;gap:.5rem}
  .planopt{display:flex;align-items:center;justify-content:space-between;gap:1rem;
    width:100%;padding:.75rem .9rem;border:1.5px solid var(--line);border-radius:10px;
    background:var(--card-soft);color:var(--ink);cursor:pointer;text-align:left;
    font:inherit;transition:border-color .15s,background .15s}
  .planopt:hover{border-color:var(--sky)}
  .planopt[aria-pressed="true"]{border-color:var(--navy);background:var(--sky-soft)}
  .planopt__t{font-weight:700;font-size:.92rem}
  .planopt__n{font-family:var(--num);font-size:1rem;font-variant-numeric:tabular-nums;
    color:var(--navy);white-space:nowrap}

  .sw__warn{margin:.2rem 0 0;padding:.6rem .8rem;border-radius:8px;
    background:#fdecea;border:1px solid #f0b8b0;color:#a33224;
    font-size:.8rem;font-weight:700;line-height:1.75}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .sw__warn{background:#3a1b17;border-color:#7a3529;color:#f0a99c}
  }
  :root[data-theme="dark"] .sw__warn{background:#3a1b17;border-color:#7a3529;color:#f0a99c}

  .wrap{max-width:1000px;margin:0 auto;padding:1.2rem 1rem 4rem;display:flex;flex-direction:column;gap:1.2rem}

  /* ---------- login ---------- */
  .login{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.6rem 1.4rem;
         display:flex;flex-direction:column;gap:.8rem;max-width:420px;margin:2rem auto;box-shadow:var(--shadow)}
  .login h2{font-family:var(--serif);font-size:1.15rem;margin:0;font-weight:600}
  .login p{margin:0;font-size:.86rem;color:var(--ink-soft)}
  .login input{
    font-family:var(--mono);font-size:1rem;padding:.6rem .7rem;
    border:1.4px solid var(--line);border-radius:9px;background:var(--card-soft);color:var(--ink);width:100%;
  }
  .btn{
    font-size:.92rem;font-weight:700;cursor:pointer;border:0;border-radius:999px;padding:.6rem 1.4rem;
    background:linear-gradient(135deg,var(--navy),var(--navy-dk));color:#fff;
  }
  :root:not([data-theme="light"]) .btn,:root[data-theme="dark"] .btn{background:linear-gradient(135deg,#1d5f92,#0d3a63)}
  .btn:disabled{background:var(--line);color:var(--ink-faint);cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--navy);border:1.4px solid var(--line)}
  .btn.danger{background:linear-gradient(135deg,#c0503f,#96382a)}
  .btn.ok{background:linear-gradient(135deg,#1f7a5c,#155c45)}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* ---------- summary ---------- */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.6rem}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .85rem;
       display:flex;flex-direction:column;gap:.1rem}
  .kpi .l{font-size:.72rem;color:var(--ink-soft)}
  .kpi .v{font-family:var(--num);font-size:1.55rem;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
  .kpi.act{border-color:var(--warn);background:var(--warn-soft)}
  .kpi.act .v{color:var(--warn)}
  .kpi.done .v{color:var(--green)}
  /* 押せるKPI（意気込み）。見た目は他のカードと揃える */
  button.kpi{font:inherit;color:inherit;text-align:left;cursor:pointer;
             font-family:inherit;-webkit-appearance:none;appearance:none}
  button.kpi:hover{border-color:var(--navy)}
  button.kpi:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
  .kpi .tapmark{display:inline-block;margin-left:.3rem;padding:0 .35rem;border-radius:4px;
                background:var(--line);color:var(--ink-soft);font-size:.62rem;vertical-align:1px}

  /* 意気込みの一覧（見るだけ） */
  .fmnote{margin:0 0 .6rem;font-size:.85rem;color:var(--ink-soft)}
  .fmnote b{color:var(--ink);font-family:var(--num)}
  .fmwrap{max-height:56vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
  table.fm{border-collapse:collapse;width:100%;font-size:.84rem}
  table.fm th,table.fm td{padding:.45rem .6rem;border-bottom:1px solid var(--line);
                          text-align:left;vertical-align:top;white-space:nowrap}
  table.fm th{position:sticky;top:0;background:var(--card);color:var(--ink-soft);
              font-size:.74rem;font-weight:700;z-index:1}
  table.fm td.when{font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--ink-soft)}
  table.fm td.nm{white-space:normal}
  table.fm tr:last-child td{border-bottom:0}
  .fmin{display:inline-block;padding:0 .45rem;border-radius:999px;
        background:var(--green-soft);color:var(--green);font-size:.7rem;font-weight:700}
  .planline{font-size:.83rem;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:.2rem .9rem}
  .planline b{color:var(--ink);font-family:var(--num)}

  /* ---------- toolbar ---------- */
  .bar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
  .tabs{display:flex;flex-wrap:wrap;gap:.35rem}
  .tab{
    font-size:.82rem;font-weight:700;cursor:pointer;border:1.3px solid var(--line);
    background:var(--card);color:var(--ink-soft);border-radius:999px;padding:.32rem .9rem;
  }
  .tab[aria-pressed="true"]{background:var(--mark-bg);color:var(--on-mark);border-color:var(--mark-bg)}
  .search{
    font-family:inherit;font-size:.88rem;padding:.4rem .7rem;border:1.3px solid var(--line);
    border-radius:9px;background:var(--card);color:var(--ink);min-width:150px;flex:1;max-width:260px;
  }

  /* ---------- list ---------- */
  .list{display:flex;flex-direction:column;gap:.7rem}
  .row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.85rem 1rem;
       display:flex;flex-direction:column;gap:.5rem}
  .row.act{border-left:4px solid var(--warn)}
  .row.fin{opacity:.72}
  .row__top{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline}
  .row__name{font-family:var(--serif);font-size:1.05rem;font-weight:600;margin-right:auto}
  .tag{font-size:.71rem;font-weight:700;padding:.1rem .6rem;border-radius:999px;white-space:nowrap}
  .tag.plan{background:var(--sky-soft);color:var(--navy)}
  .tag.stage{background:var(--card-soft);color:var(--ink-soft);border:1px solid var(--line)}
  .tag.stage.wait{background:var(--warn-soft);color:var(--warn);border-color:transparent}
  .tag.stage.done{background:var(--green-soft);color:var(--green);border-color:transparent}
  .tag.stage.new{background:var(--amber-soft);color:var(--amber);border-color:transparent}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:.15rem .9rem;font-size:.83rem}
  .facts div{display:flex;gap:.45rem}
  .facts .k{color:var(--ink-faint);white-space:nowrap;min-width:5.6em}
  .facts .v{color:var(--ink)}
  .facts .v.n{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums}
  .row__act{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
  .row__act .btn{font-size:.84rem;padding:.42rem 1.1rem}
  .empty{text-align:center;color:var(--ink-faint);font-size:.9rem;padding:2.5rem 1rem}

  /* ---------- modal ---------- */
  .scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;
         padding:1rem;z-index:50}
  .modal{background:var(--card);border-radius:14px;box-shadow:var(--shadow);max-width:460px;width:100%;
         max-height:88vh;overflow:auto;padding:1.3rem 1.3rem 1.1rem;display:flex;flex-direction:column;gap:.8rem}
  .modal h2{font-family:var(--serif);font-size:1.15rem;margin:0;font-weight:600}
  .modal p{margin:0;font-size:.88rem;color:var(--ink-soft)}
  .modal .check{background:var(--card-soft);border:1px solid var(--line);border-radius:10px;padding:.8rem .9rem;
                display:flex;flex-direction:column;gap:.25rem;font-size:.9rem}
  .modal .check .r{display:flex;gap:.6rem}
  .modal .check .r .k{color:var(--ink-faint);min-width:6.2em}
  .modal .check .r .v{color:var(--ink);font-weight:600}
  .modal .check .r .v.n{font-family:var(--num);font-size:1.15rem}
  .modal .foot{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap}
  .warnbox{background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:.6rem .8rem;font-size:.83rem;font-weight:700}
  .picklist{max-height:250px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:.5rem .6rem}
  .picklist label{display:flex;gap:.5rem;align-items:flex-start;padding:.35rem .1rem;border-bottom:1px solid var(--line);font-size:.88rem}
  .picklist label:last-child{border-bottom:0}
  .picklist .who{margin-right:auto}
  .picklist .sub{font-size:.76rem;color:var(--ink-faint)}
  .sumbox{background:var(--sky-soft);color:var(--navy);border-radius:9px;padding:.55rem .8rem;font-weight:700;font-size:.9rem}

  .toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);z-index:60;
         background:var(--navy-dk);color:#fff;border-radius:999px;padding:.6rem 1.3rem;font-size:.88rem;
         box-shadow:var(--shadow);max-width:90vw}
  :root:not([data-theme="light"]) .toast,:root[data-theme="dark"] .toast{background:#0d3a63}
  .toast.bad{background:#96382a}

  footer{max-width:1000px;margin:0 auto;padding:0 1rem 2rem;font-size:.78rem;color:var(--ink-faint)}
  /* 凛穏ロゴ。明るい画面と暗い画面で絵柄を差し替える（紺の字が沈まないように） */
  .foot-logo{display:block;width:44px;height:38px;margin:0 0 8px;opacity:.5;
    background:center/contain no-repeat url("assets/logo-mark-160.png")}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .foot-logo{background-image:url("assets/logo-mark-light-160.png")}
  }
  :root[data-theme="dark"] .foot-logo{background-image:url("assets/logo-mark-light-160.png")}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="head">
  <div class="head__in">
    <div class="head__t">
      <span class="head__k">RION JUKU / 3rd</span>
      <span class="head__n">受付管理</span>
    </div>
    <span id="flag" class="flag" hidden></span>
    <button type="button" id="btn-push" hidden title="スマホ通知の設定">🔔</button>
    <button type="button" id="btn-reload" hidden>更新</button>
    <button type="button" id="btn-logout" hidden>キーを消す</button>
  </div>
</header>

<!-- ============ ログイン ============ -->
<section id="screen-login" class="login">
  <h2>管理キーを入れてください</h2>
  <p>この画面はスプレッドシートの写しです。運営の方だけがお使いください。</p>
  <input type="password" id="key" autocomplete="off" spellcheck="false" placeholder="管理キー">
  <button type="button" class="btn" id="btn-login">開く</button>
  <p id="login-err" style="color:var(--warn);font-weight:700" hidden></p>
</section>

<!-- ============ 一覧 ============ -->
<main id="screen-main" class="wrap" hidden>

  <!-- ============ スイッチ ============ -->
  <section class="switches" id="switches" hidden>
    <div class="sw" id="sw-test">
      <div class="sw__t">
        <b>🧪 テスト決済モード</b>
        <span class="sw__d">オンのあいだは、カード決済が <b>1回目100円／2回目150円</b> のページに切り替わります。
          コースの金額では請求されません。</span>
      </div>
      <button type="button" class="swbtn" data-flag="test_mode" aria-pressed="false">オフ</button>
    </div>

    <div class="sw" id="sw-gate">
      <div class="sw__t">
        <b>🚪 受付をテスト用に開く</b>
        <span class="sw__d">オンのあいだは、受付開始（<span data-open-at>—</span>）を待たずに手続きできます。
          オフが本番です。</span>
      </div>
      <button type="button" class="swbtn" data-flag="open_gate_off" aria-pressed="false">オフ</button>
    </div>

    <p class="sw__warn" id="sw-warn" hidden></p>
  </section>

  <div class="cards" id="kpis"></div>
  <div class="planline" id="plans"></div>

  <div class="bar">
    <div class="tabs" id="tabs">
      <button type="button" class="tab" data-f="act" aria-pressed="true">要対応</button>
      <button type="button" class="tab" data-f="all" aria-pressed="false">すべて</button>
      <button type="button" class="tab" data-f="new" aria-pressed="false">未案内</button>
      <button type="button" class="tab" data-f="prog" aria-pressed="false">進行中</button>
      <button type="button" class="tab" data-f="done" aria-pressed="false">完了</button>
    </div>
    <input type="search" class="search" id="q" placeholder="お名前でさがす">
    <button type="button" class="btn ghost" id="btn-invite">ご案内を送る</button>
  </div>

  <div class="list" id="list"></div>
</main>

<footer>
  <span class="foot-logo" aria-hidden="true"></span>
  <p id="foot"></p>
</footer>

<script>
/* =========================================================================
   凛穏塾 3期生 受付管理（運営用）
   ・スプレッドシートの「管理」タブを読み出して並べるだけの画面です。
   ・書き換えるのは「入金確認」だけ。ほかは見るだけにしてあります。
   ========================================================================= */

const GAS_URL = 'https://script.google.com/macros/s/AKfycbwxo1mNRBl5Gjp86XbNXZONgkNHAGHp86uqQYux0Lu3CnP11zH8is5MFrqik0VwvcXL/exec';
const KEY_STORE = 'rion3ki_admin_key';
const RELOAD_MS = 60000;

let adminKey = null;
let data = null;
let filter = 'act';
let timer = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const yen = (n) => (n === '' || n == null) ? '' : Number(n).toLocaleString('ja-JP') + '円';

/* ---------- 通信 ---------- */
/* =========================================================================
   スイッチ（🧪 テスト決済モード ／ 🚪 受付をテスト用に開く）

   ★どちらも「オン＝ふだんと違う状態」です。オンのあいだはボタンが赤くなり、
     下に赤い注意書きが出ます。本番のお客様をご案内する前に、両方オフに。
   ★受付のほうは、GAS側では OPEN_GATE（true＝開始日を守る）で持っています。
     画面では分かりやすさを優先して「テスト用に開く」の向きで出すので、
     送るときに反転させています。
   ========================================================================= */
let FLAGS = {};

function paintFlags(f) {
  FLAGS = f || {};

  const gateOff = (FLAGS.open_gate === false);      // 受付をテスト用に開けている
  const testOn = !!FLAGS.test_mode;

  const sw = $('switches');
  if (sw) sw.hidden = false;

  setSwitch('test_mode', testOn);
  setSwitch('open_gate_off', gateOff);

  document.querySelectorAll('[data-open-at]').forEach(el => {
    el.textContent = FLAGS.open_at_text || '—';
  });

  // 帯（右上）
  const flag = $('flag');
  flag.hidden = false;
  if (testOn) {
    flag.textContent = '🧪 テスト決済モード（100円／150円）';
    flag.className = 'flag test';
  } else if (gateOff) {
    flag.textContent = '🚪 受付をテスト用に開いています';
    flag.className = 'flag gate';
  } else if (FLAGS.before_open) {
    flag.textContent = '受付前（' + (FLAGS.open_at_text || '') + 'から）';
    flag.className = 'flag dry';
  } else {
    flag.textContent = FLAGS.dry_run ? 'お試し中（LINEは飛びません）' : '本番運転';
    flag.className = 'flag' + (FLAGS.dry_run ? ' dry' : '');
  }

  // 赤い注意書き
  const warn = $('sw-warn');
  const msgs = [];
  if (testOn) msgs.push('🧪 決済がテスト用（1回目100円／2回目150円）になっています。');
  if (gateOff) msgs.push('🚪 受付開始（' + (FLAGS.open_at_text || '') + '）の前ですが、開いています。');
  if (msgs.length) {
    warn.hidden = false;
    warn.textContent = msgs.join(' ') + ' お客様をご案内する前に、必ずオフに戻してください。';
  } else {
    warn.hidden = true;
  }
}

function setSwitch(key, on) {
  const b = document.querySelector('.swbtn[data-flag="' + key + '"]');
  if (!b) return;
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.textContent = on ? 'オン' : 'オフ';
  b.disabled = false;
}

document.addEventListener('click', async (e) => {
  const b = e.target.closest('.swbtn');
  if (!b) return;

  const key = b.dataset.flag;
  const nowOn = b.getAttribute('aria-pressed') === 'true';
  const next = !nowOn;

  const label = key === 'test_mode' ? '🧪 テスト決済モード' : '🚪 受付をテスト用に開く';
  const detail = key === 'test_mode'
    ? (next ? 'カード決済が 1回目100円／2回目150円 のページに変わります。\n'
              + 'いま手続き中のお客様も、この金額の画面になります。'
            : '本物の金額（VIP 990,000円 など）に戻します。')
    : (next ? '受付開始（' + (FLAGS.open_at_text || '') + '）を待たずに手続きできるようになります。'
            : '受付開始（' + (FLAGS.open_at_text || '') + '）まで、受付を閉じます。');

  if (!confirm(label + ' を「' + (next ? 'オン' : 'オフ') + '」にします。\n\n' + detail + '\n\nよろしいですか？')) return;

  b.disabled = true;
  try {
    // 画面は「テスト用に開く」、GASは「開始日を守る」。向きが逆なので反転させる
    const sendKey = (key === 'open_gate_off') ? 'open_gate' : key;
    const sendVal = (key === 'open_gate_off') ? !next : next;
    const r = await api('admin_set_flag', { key: sendKey, value: sendVal ? 'true' : 'false' });
    if (!r || r.ok === false) throw new Error((r && r.error) || '切り替えられませんでした');
    paintFlags(r);
    toast(label + ' を ' + (next ? 'オン' : 'オフ') + ' にしました');
  } catch (err) {
    b.disabled = false;
    toast(String(err.message || err), true);
  }
});

async function api(action, body) {
  const payload = Object.assign({ action, token: adminKey }, body || {});
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error('通信に失敗しました（' + res.status + '）');
  return res.json();
}

function toast(msg, bad) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), bad ? 5000 : 2800);
}

/* ---------- ログイン ---------- */
$('btn-login').addEventListener('click', login);
$('key').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

async function login() {
  const v = $('key').value.trim();
  if (!v) return;
  adminKey = v;
  $('btn-login').disabled = true;
  $('login-err').hidden = true;
  try {
    const r = await api('admin_list');
    if (!r.ok) throw new Error(r.error === 'admin_only' ? '管理キーが違います。' : r.error);
    localStorage.setItem(KEY_STORE, v);
    show(r);
  } catch (err) {
    adminKey = null;
    $('login-err').textContent = err.message || '開けませんでした。';
    $('login-err').hidden = false;
  } finally {
    $('btn-login').disabled = false;
  }
}

$('btn-logout').addEventListener('click', () => {
  localStorage.removeItem(KEY_STORE);
  location.reload();
});
$('btn-reload').addEventListener('click', () => load(true));

/* ---------- 読み込み ---------- */
async function load(loud) {
  try {
    const r = await api('admin_list');
    if (!r.ok) throw new Error(r.error);
    show(r);
    if (loud) toast('最新にしました');
  } catch (err) {
    toast(err.message || '読み込めませんでした', true);
  }
}

function show(r) {
  data = r;
  $('screen-login').hidden = true;
  $('screen-main').hidden = false;
  $('btn-reload').hidden = false;
  $('btn-logout').hidden = false;
  paintPushBadge();
  pushRefresh();

  paintFlags(r.flags || { test_mode: r.test_mode, dry_run: r.dry_run });

  $('foot').textContent = 'GAS ' + (r.version || '') + ' ／ ' + r.people.length + '名';
  paintKpis();
  paintList();

  if (timer) clearInterval(timer);
  timer = setInterval(() => load(false), RELOAD_MS);
}

/* ---------- 集計 ---------- */
function paintKpis() {
  const s = data.summary;
  const cards = [
    { l: '意気込み', v: s.ikigomi || 0, cls: 'tap', act: 'forms' },
    { l: '合計', v: s.total },
    { l: '未案内', v: s.notInvited },
    { l: '規約同意', v: s.terms },
    { l: '署名', v: s.signed },
    { l: '着金待ち', v: s.waiting, cls: 'act' },
    { l: '完了', v: s.done, cls: 'done' }
  ];
  // 「意気込み」だけは押せます（中身は見るだけ・下の showForms）
  $('kpis').innerHTML = cards.map((c) => {
    const inner = '<span class="l">' + c.l + (c.act ? ' <span class="tapmark">見る</span>' : '')
                + '</span><span class="v">' + c.v + '</span>';
    return c.act
      ? '<button type="button" class="kpi ' + (c.cls || '') + '" data-act="' + c.act + '">'
        + inner + '</button>'
      : '<div class="kpi ' + (c.cls || '') + '">' + inner + '</div>';
  }).join('');

  $('plans').innerHTML = data.planOrder.map((p) =>
    '<span>' + esc(p) + '　<b>' + data.byPlan[p] + '</b> 名</span>').join('');
}

/* ---------- 意気込みシート（見るだけ）----------------------------------
   2026-09-01 とーるさんご要望。
   「誰が出したか」と「何件か」だけを見ます。ご記入の中身はここには出しません
   （中身はスプレッドシートの「📖 意気込み」「📝 審査」で読みます）。
------------------------------------------------------------------------ */
$('kpis').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act="forms"]');
  if (b) showForms();
});

async function showForms() {
  const el = modal(
    '<h2>📖 意気込みシート</h2>'
    + '<div id="fm-body" style="font-size:.88rem;color:var(--ink-soft)">読み込んでいます…</div>'
    + '<div class="foot"><button type="button" class="btn ghost" data-close>閉じる</button></div>');

  const body = el.querySelector('#fm-body');

  let r;
  try {
    r = await api('admin_forms');
  } catch (err) {
    body.innerHTML = '<div class="warnbox">読み込めませんでした。'
      + esc(String(err && err.message || err)) + '</div>';
    return;
  }
  if (!r || !r.ok) {
    body.innerHTML = '<div class="warnbox">読み込めませんでした（'
      + esc(String(r && r.error || 'error')) + '）</div>';
    return;
  }

  const c = r.count || {};
  let note = '届いている意気込み <b>' + (c.second || 0) + '</b> 件';
  if (c.inApp)     note += '　／　うちアプリに入っている方 <b>' + c.inApp + '</b> 名';
  if (c.firstOnly) note += '<br>「希望されますか」だけで、意気込みがまだの方 <b>'
                         + c.firstOnly + '</b> 名';

  if (!r.rows.length) {
    body.innerHTML = '<p class="fmnote">' + note + '</p>'
      + '<p style="margin:0">まだ1件も届いていません。</p>';
    return;
  }

  const tr = r.rows.map((x) =>
    '<tr><td class="nm">' + esc(x.name)
    + (x.inApp ? ' <span class="fmin">入場ずみ</span>' : '') + '</td>'
    + '<td class="when">' + esc(x.second || '') + '</td>'
    + '<td class="when">' + esc(x.first || '—') + '</td></tr>').join('');

  body.innerHTML = '<p class="fmnote">' + note + '</p>'
    + '<div class="fmwrap"><table class="fm">'
    + '<thead><tr><th>お名前</th><th>意気込み</th><th>ご希望</th></tr></thead>'
    + '<tbody>' + tr + '</tbody></table></div>'
    + '<p style="margin:.6rem 0 0;font-size:.78rem">'
    + 'ご記入の中身は、スプレッドシートの「📖 意気込み」「📝 審査」でご覧ください。</p>';
}

$('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('.tab');

  filter = b.dataset.f;

/* 運営の出番が来ている方。
   ・着金待ち … 入金を確認する
   ・プラン未設定 … コースを決める（決めるまで、その方は先へ進めません） */
function needsAction(p) {
  if (p.stage === '着金待ち') return true;
  if (!p.plan || p.plan === '未') return true;
  return false;
}

function match(p) {
  const q = $('q').value.trim();
  if (q && p.name.indexOf(q) === -1) return false;
  if (filter === 'all') return true;
  if (filter === 'act') return needsAction(p);
  if (filter === 'new') return !p.invite;
  if (filter === 'done') return p.stage === '完了';
  if (filter === 'prog') return !!p.invite && p.stage !== '完了';
  return true;
}

function stageClass(p) {
  if (p.stage === '完了') return 'done';
  if (p.stage === '着金待ち') return 'wait';
  if (!p.invite) return 'new';
  return '';
}

function paintList() {
  const rows = data.people.filter(match);
  if (!rows.length) {
    $('list').innerHTML = '<p class="empty">この条件に当てはまる方はいません。</p>';
    return;
  }
  $('list').innerHTML = rows.map(card).join('');
}

function card(p) {
  const facts = [];
  const put = (k, v, num) => {
    if (!v && v !== 0) return;
    facts.push('<div><span class="k">' + k + '</span><span class="v' + (num ? ' n' : '') + '">'
               + esc(v) + '</span></div>');
  };
  put('ご案内', p.invite || '—');
  put('規約同意', p.terms);
  put('ご署名', p.sign);
  put('お支払い', p.method);
  if (p.method === 'カード2回') {
    put('1回目', p.pay1);
    put('2回目の方法', p.second);
    put('2回目', p.pay2);
  } else {
    put('ご決済', p.pay1);
  }
  put('お振込期限', p.bankDue);
  put('振込ご連絡', p.report);
  put('お名義', p.holder);
  put('お振込日', p.paidOn);
  if (p.due !== '' && p.due != null) put('ご確認金額', yen(p.due), true);
  put('入金確認', p.bankOk);
  put('メモ', p.memo);

  const act = needsAction(p);
  let buttons = '';
  if (act) {
    buttons = '<button type="button" class="btn danger" data-confirm="' + esc(p.uid) + '">'
            + '入金を確認する</button>';
  } else if (!p.invite) {
    buttons = '<span style="font-size:.82rem;color:var(--ink-faint)">'
            + 'まだご案内をお送りしていません</span>';
  }

  // コースがまだ決まっていない方は、ここから決められる（決まっている方には出さない）
  if (!p.plan || p.plan === '未') {
    buttons = '<button type="button" class="btn" data-setplan="' + esc(p.uid) + '">'
            + 'コースを決める</button>'
            + (buttons ? ' ' + buttons : '');
  }

  return '<div class="row ' + (act ? 'act' : (p.stage === '完了' ? 'fin' : '')) + '">'
    + '<div class="row__top">'
    +   '<span class="row__name">' + esc(p.name) + '</span>'
    +   '<span class="tag plan">' + esc(p.plan) + '</span>'
    +   '<span class="tag stage ' + stageClass(p) + '">' + esc(p.stage) + '</span>'
    + '</div>'
    + '<div class="facts">' + facts.join('') + '</div>'
    + (buttons ? '<div class="row__act">' + buttons + '</div>' : '')
    + '</div>';
}

/* ---------- 入金確認（誤タップ防止つき） ---------- */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-confirm]');

/* ---------- コースを決める（選ぶ → 確かめる → 決める） ----------
   ★決められるのは「まだ決まっていない方」だけ。決まっている方には
     ボタンが出ませんし、GAS側でも弾いています。
     決めた瞬間に、その方のアプリが規約同意の画面に変わります。LINEは飛びません。 */
function askSetPlan(uid) {
  const p = data.people.filter((x) => x.uid === uid)[0];
  if (!p) return;

  const plans = (FLAGS.plans && FLAGS.plans.length) ? FLAGS.plans : [];
  if (!plans.length) { toast('コースの一覧を読めませんでした。更新してからお試しください', true); return; }

  const el = modal(
    '<h2>コースを決める</h2>'
    + '<div class="r"><span class="k">お名前</span><span class="v">' + esc(p.name) + '</span></div>'
    + '<p style="margin:.9rem 0 .5rem;font-size:.86rem">どのコースでご案内しますか？</p>'
    + '<div class="plancho">'
    +   plans.map((x) =>
          '<button type="button" class="planopt" data-pick="' + esc(x.key) + '">'
          + '<span class="planopt__t">' + esc(x.label) + '</span>'
          + '<span class="planopt__n">' + esc(yen(x.total)) + '</span></button>').join('')
    + '</div>'
    + '<div class="warnbox" id="sp-warn" hidden></div>'
    + '<div class="foot">'
    +   '<button type="button" class="btn ghost" data-close>やめる</button>'
    +   '<button type="button" class="btn ok" id="do-setplan" disabled>コースを選んでください</button>'
    + '</div>');

  const btn = el.querySelector('#do-setplan');
  const warn = el.querySelector('#sp-warn');
  let picked = null;
  let tick = null;

  el.querySelectorAll('[data-pick]').forEach((b) => {
    b.addEventListener('click', () => {
      el.querySelectorAll('[data-pick]').forEach((x) => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      picked = plans.filter((x) => x.key === b.dataset.pick)[0];

      warn.hidden = false;
      warn.innerHTML = '<b>' + esc(p.name) + '</b> 様を <b>' + esc(picked.label) + '（'
        + esc(yen(picked.total)) + '）</b> でご案内します。<br>'
        + '決めると、この方のアプリが規約同意の画面に変わります。'
        + 'あとから変えるときは、管理シートのD列で直してください。';

      // 押し間違い防止に、3秒たってからボタンを有効にする
      if (tick) clearInterval(tick);
      btn.disabled = true;
      let left = 3;
      btn.textContent = String(left);
      tick = setInterval(() => {
        left--;
        if (left > 0) { btn.textContent = String(left); return; }
        clearInterval(tick); tick = null;
        btn.disabled = false;
        btn.textContent = 'このコースで決める';
      }, 1000);
    });
  });

  btn.addEventListener('click', async () => {
    if (!picked) return;
    btn.disabled = true;
    btn.textContent = '送信中…';
    try {
      const r = await api('admin_set_plan', { uid: p.uid, plan: picked.key });
      if (!r || r.ok === false) {
        if (r && r.error === 'already_set') {
          throw new Error('この方は、すでに「' + r.now + '」で決まっています。更新してご確認ください。');
        }
        throw new Error((r && r.error) || 'うまくいきませんでした');
      }
      close();
      toast(r.name + ' 様を ' + picked.label + ' にしました');
      load(false);
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'このコースで決める';
      toast(String(err.message || err), true);
    }
  });
}

function askConfirm(uid) {
  const p = data.people.filter((x) => x.uid === uid)[0];
  if (!p) return;

  const rows = [
    ['お名前', esc(p.name), false],
    ['コース', esc(p.plan), false],
    ['お名義', esc(p.holder || '（お伺いできていません）'), false],
    ['お振込日', esc(p.paidOn || '—'), false],
    ['ご確認金額', esc(yen(p.due)), true]
  ].map((r) => '<div class="r"><span class="k">' + r[0] + '</span>'
             + '<span class="v' + (r[2] ? ' n' : '') + '">' + r[1] + '</span></div>').join('');

  const el = modal(
    '<h2>ご入金を確認しますか</h2>'
    + '<p>通帳と、下の内容が合っているかをお確かめください。</p>'
    + '<div class="check">' + rows + '</div>'
    + '<div class="warnbox">確認済みにすると、この方に完了のご連絡が自動で届きます。あとから取り消せません。</div>'
    + '<div class="foot">'
    +   '<button type="button" class="btn ghost" data-close>やめる</button>'
    +   '<button type="button" class="btn ok" id="do-confirm" disabled>3</button>'
    + '</div>');

  // 押し間違い防止に、3秒たってからボタンを有効にする
  const btn = el.querySelector('#do-confirm');
  let left = 3;
  const tick = setInterval(() => {
    left--;
    if (left > 0) { btn.textContent = String(left); return; }
    clearInterval(tick);
    btn.disabled = false;
    btn.textContent = '確認済みにする';
  }, 1000);

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    btn.textContent = '送信中…';
    try {
      const r = await api('admin_confirm', { uid: p.uid, amount: p.due });
      if (!r.ok) {
        if (r.error === 'amount_changed') {
          throw new Error('金額が変わっています（いまは ' + yen(r.due) + '）。更新してからもう一度お願いします。');
        }
        if (r.error === 'already') throw new Error('この方は、すでに確認済みです。');
        throw new Error(r.error || 'うまくいきませんでした');
      }
      close();
      toast(r.name + ' 様を確認済みにしました');
      load(false);
    } catch (err) {
      btn.disabled = false;
      btn.textContent = '確認済みにする';
      toast(err.message, true);
    }
  });
}

/* ---------- ご案内を送る ---------- */
$('btn-invite').addEventListener('click', askInvite);

function askInvite() {
  const cands = data.people.filter((p) => !p.invite && p.plan && p.plan !== '未');
  if (!cands.length) {
    const none = data.people.filter((p) => !p.invite).length;
    toast(none ? 'コースが決まっていない方しかいません。先に面談シートでコースをお選びください。'
               : 'まだご案内をお送りしていない方はいません。', true);
    return;
  }

  const list = cands.map((p, i) =>
    '<label><input type="checkbox" checked data-plan="' + esc(p.plan) + '" value="' + esc(p.uid) + '">'
    + '<span class="who">' + esc(p.name) + '<br><span class="sub">' + esc(p.plan)
    + '／' + esc(p.stage) + '</span></span></label>').join('');

  const el = modal(
    '<h2>お申し込みのご案内を送る</h2>'
    + '<p><b>はじめから全員にチェックが入っています。</b>送らない方のチェックを外してください。</p>'
    + '<div style="display:flex;gap:.4rem">'
    +   '<button type="button" class="btn ghost" data-all="1" style="font-size:.8rem;padding:.3rem .9rem">全部つける</button>'
    +   '<button type="button" class="btn ghost" data-all="0" style="font-size:.8rem;padding:.3rem .9rem">全部はずす</button>'
    + '</div>'
    + '<div class="sumbox" id="inv-sum"></div>'
    + '<div class="picklist">' + list + '</div>'
    + (data.dry_run ? '<div class="warnbox" style="background:var(--amber-soft);color:var(--amber)">'
        + 'いまはお試し中です。送信の予定だけが記録され、LINEは飛びません。</div>' : '')
    + '<div class="foot">'
    +   '<button type="button" class="btn ghost" data-close>やめる</button>'
    +   '<button type="button" class="btn" id="do-invite">この方に送る</button>'
    + '</div>');

  const boxes = () => [].slice.call(el.querySelectorAll('.picklist input[type=checkbox]'));
  function sum() {
    const order = [], m = {};
    let n = 0;
    boxes().forEach((b) => {
      if (!b.checked) return;
      n++;
      const p = b.getAttribute('data-plan') || '未';
      if (m[p] === undefined) { m[p] = 0; order.push(p); }
      m[p]++;
    });
    const txt = order.map((k) => k + ' ' + m[k] + '名').join('／');
    $('inv-sum').textContent = n ? ('送る：合計 ' + n + '名（' + txt + '）') : '送る方が選ばれていません';
    return { n, txt };
  }
  el.addEventListener('change', sum);
  el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-all]');
    if (!b) return;
    boxes().forEach((x) => { x.checked = b.dataset.all === '1'; });
    sum();
  });
  sum();

  el.querySelector('#do-invite').addEventListener('click', async () => {
    const s = sum();
    if (!s.n) { toast('1人も選ばれていません。', true); return; }
    if (!window.confirm('合計 ' + s.n + '名（' + s.txt + '）に\nお申し込みのご案内を送ります。\n\nよろしいですか？')) return;

    const btn = el.querySelector('#do-invite');
    btn.disabled = true;
    btn.textContent = '送信中…';
    try {
      const uids = boxes().filter((b) => b.checked).map((b) => b.value);
      const r = await api('admin_invite', { uids });
      if (!r.ok) throw new Error(r.error || 'うまくいきませんでした');
      close();
      toast(r.message);
      load(false);
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'この方に送る';
      toast(err.message, true);
    }
  });
}

/* =========================================================================
   🔔 スマホ通知（Firebase Cloud Messaging）
   ・ホーム画面に追加したこの画面へ、受付のお知らせを届けます。
   ・どのお知らせを受け取るかは、運営お一人おひとり（＝端末ごと）に決められます。
   ・iPhoneは「ホーム画面に追加」してからでないと通知を受け取れません（Appleの仕様）。
   ========================================================================= */
const PUSH_CFG = {
  apiKey: 'AIzaSyBpBpGmxfWhyHq3rzwH2Oa_6IWDIZbOAj8',
  authDomain: 'elabo-plus.firebaseapp.com',
  projectId: 'elabo-plus',
  messagingSenderId: '452649305918',
  appId: '1:452649305918:web:4bef5bae57aee4d86c4e6f'
};
const VAPID_KEY = 'BAtxAvwJITAJ_q2DHtIajcTI_UEgJQhOlPI3uQ8IlXoV_kfyG3SQyRSVkT83Iyln9RsReuwgcR3By6g7roWif1Y';
const PUSH_ON   = 'rion3ki_push_on';    // この端末で通知をオンにしたか
const PUSH_NAME = 'rion3ki_push_name';  // 端末の呼び名（どなたの端末か分かるように）

let pushToken = null;

function pushSupported() {
  return ('Notification' in window) && ('serviceWorker' in navigator) && !!window.isSecureContext;
}
function isIos() {
  // iPadOSはMacを名乗るので、指で触れるかどうかも見る
  return /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

/** 通知が使えないとき、何が足りないのかを並べる */
function diagRows() {
  const rows = [
    ['通知の機能（Notification）', ('Notification' in window)],
    ['裏で待つ仕組み（Service Worker）', ('serviceWorker' in navigator)],
    ['安全な接続（https）', !!window.isSecureContext],
    ['ホーム画面から起動', isStandalone()]
  ];
  return rows.map((r) =>
    '<div class="pushdiag__r"><span>' + esc(r[0]) + '</span><b class="' + (r[1] ? 'ok' : 'ng') + '">'
    + (r[1] ? '使えます' : '見つかりません') + '</b></div>').join('');
}
function isStandalone() {
  return window.navigator.standalone === true
    || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
}

let fbLoading = null;
function loadFirebase() {
  if (window.firebase && window.firebase.messaging) return Promise.resolve();
  if (fbLoading) return fbLoading;
  const one = (src) => new Promise((ok, ng) => {
    const el = document.createElement('script');
    el.src = src;
    el.onload = ok;
    el.onerror = () => ng(new Error('通知の部品を読み込めませんでした'));
    document.head.appendChild(el);
  });
  fbLoading = one('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js')
    .then(() => one('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js'))
    .then(() => { if (!firebase.apps.length) firebase.initializeApp(PUSH_CFG); });
  return fbLoading;
}

/** この端末のトークンを取る（通知の許可もここで取ります） */
async function pushGetToken() {
  if (!pushSupported()) throw new Error('この端末では通知を使えません。');
  await loadFirebase();
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') {
    throw new Error('通知が許可されませんでした。端末の設定からも変えられます。');
  }
  const q = new URLSearchParams(PUSH_CFG).toString();
  const reg = await navigator.serviceWorker.register('firebase-messaging-sw.js?' + q);
  const token = await firebase.messaging()
    .getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
  if (!token) throw new Error('通知の登録ができませんでした。少し時間をおいてお試しください。');
  pushToken = token;
  return token;
}

/** ヘッダーの🔔に、いまオンかどうかの緑の点をつける */
function paintPushBadge() {
  const b = $('btn-push');
  if (!b) return;
  b.hidden = false;
  const on = localStorage.getItem(PUSH_ON) === '1'
    && ('Notification' in window) && Notification.permission === 'granted';
  b.classList.toggle('on', on);
  b.textContent = on ? '🔔' : '🔕';
}

/** 一度オンにした端末は、画面を開くたびに黙ってトークンを入れ直しておく */
async function pushRefresh() {
  if (localStorage.getItem(PUSH_ON) !== '1') return;
  if (!pushSupported() || Notification.permission !== 'granted') return;
  try {
    const token = await pushGetToken();
    await api('admin_push_register', { fcm: token, name: localStorage.getItem(PUSH_NAME) || '' });
  } catch (err) { /* 黙っておく。画面は止めない */ }
}

$('btn-push').addEventListener('click', showPush);

async function showPush() {
  const el = modal(
    '<h2>🔔 スマホ通知</h2>'
    + '<p>この端末に、受付のお知らせを届けます。設定はお一人おひとり（端末ごと）です。</p>'
    + '<div id="pu-body" style="font-size:.88rem;color:var(--ink-soft)">読み込んでいます…</div>'
    + '<div class="foot">'
    +   '<button type="button" class="btn ghost" data-close>閉じる</button>'
    +   '<button type="button" class="btn ok" id="pu-main" hidden></button>'
    + '</div>');

  const body = el.querySelector('#pu-body');
  const main = el.querySelector('#pu-main');

  // ★iPhoneの判定を先に。Safariのタブでは Notification 自体が無いので、
  //   先に pushSupported() を見ると「使えません」が出て理由が伝わらない。
  if (isIos() && !isStandalone()) {
    body.innerHTML = '<div class="warnbox">iPhone・iPadでは、'
      + '<b>ホーム画面に追加したこの画面</b>からでないと通知を受け取れません（Appleの決まりです）。</div>'
      + '<p style="margin:.7rem 0 .3rem"><b>やりかた</b></p>'
      + '<ol style="margin:0;padding-left:1.3em;font-size:.86rem;line-height:1.9">'
      + '<li>Safariの下（または上）の <b>共有ボタン（□に↑）</b> を押す</li>'
      + '<li><b>「ホーム画面に追加」</b> を選ぶ</li>'
      + '<li>ホーム画面にできた<b>アイコンから開き直す</b></li>'
      + '<li>もう一度この 🔔 を押す</li></ol>';
    return;
  }
  if (!pushSupported()) {
    body.innerHTML = '<div class="warnbox">この端末では通知を使えません。</div>'
      + '<p style="margin:.7rem 0 .3rem">足りないものはこちらです。</p>'
      + '<div class="pushdiag">' + diagRows() + '</div>'
      + '<p style="margin:.7rem 0 0;font-size:.82rem">'
      + 'パソコンならChrome、AndroidならChrome、iPhoneならホーム画面に追加したこの画面から'
      + 'お試しください。（社内ネットワークや、ブラウザの拡張機能でとめられていることもあります）</p>';
    return;
  }

  const on = localStorage.getItem(PUSH_ON) === '1' && Notification.permission === 'granted';

  // ── まだオンにしていない端末。まずは許可を取るところから
  if (!on) {
    body.innerHTML = '<p style="margin:0 0 .6rem">「通知を受け取る」を押すと、'
      + '端末から許可を聞かれます。許可すると、お知らせの種類を選べるようになります。</p>'
      + '<p style="margin:0">はじめは <b>振込のご連絡</b> と <b>カード決済のご連絡</b> の'
      + '2つがオンになります。</p>';
    main.hidden = false;
    main.textContent = '通知を受け取る';
    main.onclick = async () => {
      main.disabled = true;
      main.textContent = '登録しています…';
      try {
        const token = await pushGetToken();
        const name = (localStorage.getItem(PUSH_NAME) || '').trim()
          || (prompt('どなたの端末ですか？（例：ゆきこ／iPhone）', '') || '').trim()
          || 'お名前なし';
        localStorage.setItem(PUSH_NAME, name);
        const r = await api('admin_push_register', { fcm: token, name });
        if (!r || !r.ok) throw new Error((r && r.error) || '登録できませんでした');
        localStorage.setItem(PUSH_ON, '1');
        paintPushBadge();
        toast('通知をオンにしました');
        close();
        showPush();
      } catch (err) {
        main.disabled = false;
        main.textContent = '通知を受け取る';
        body.innerHTML = '<div class="warnbox">' + esc(String(err.message || err)) + '</div>';
      }
    };
    return;
  }

  // ── すでにオンの端末。種類の一覧を出す
  try {
    if (!pushToken) await pushGetToken();
    let r = await api('admin_push_get', { fcm: pushToken });
    if (!r || !r.ok) throw new Error((r && r.error) || '設定を読めませんでした');
    if (!r.registered) {
      r = await api('admin_push_register', {
        fcm: pushToken, name: localStorage.getItem(PUSH_NAME) || 'お名前なし'
      });
      if (!r || !r.ok) throw new Error((r && r.error) || '登録できませんでした');
    }
    paintPushRows(body, main, r);
  } catch (err) {
    body.innerHTML = '<div class="warnbox">' + esc(String(err.message || err)) + '</div>';
  }
}

function paintPushRows(body, main, r) {
  const kinds = r.kinds || [];
  const prefs = r.prefs || {};

  body.innerHTML =
    '<div class="sumbox">この端末：' + esc(localStorage.getItem(PUSH_NAME) || 'お名前なし') + '</div>'
    + (r.ready ? '' : '<div class="warnbox" style="margin-top:.6rem">'
        + 'まだ送信のかぎ（FCM_PRIVATE_KEY）が入っていないため、実際には届きません。'
        + '設定だけ先に保存できます。</div>')
    + '<div class="pushlist">'
    + kinds.map((k) =>
        '<label class="pushrow">'
        + '<input type="checkbox" data-kind="' + esc(k.key) + '"'
        + (prefs[k.key] ? ' checked' : '') + '>'
        + '<span><b>' + esc(k.label) + '</b>'
        + (k.hint ? '<em>' + esc(k.hint) + '</em>' : '') + '</span></label>').join('')
    + '</div>'
    + '<p style="margin:.8rem 0 0;font-size:.8rem">'
    + '<button type="button" class="lnk" id="pu-test">試しに1つ送ってみる</button>'
    + '　<button type="button" class="lnk" id="pu-off">この端末の通知をやめる</button></p>';

  main.hidden = false;
  main.textContent = '保存する';
  main.onclick = async () => {
    const want = {};
    body.querySelectorAll('[data-kind]').forEach((c) => { want[c.dataset.kind] = c.checked; });
    main.disabled = true;
    main.textContent = '保存しています…';
    try {
      const res = await api('admin_push_prefs', { fcm: pushToken, prefs: JSON.stringify(want) });
      if (!res || !res.ok) throw new Error((res && res.error) || '保存できませんでした');
      toast('通知の設定を保存しました');
      close();
    } catch (err) {
      main.disabled = false;
      main.textContent = '保存する';
      toast(String(err.message || err), true);
    }
  };

  body.querySelector('#pu-test').addEventListener('click', async () => {
    try {
      const res = await api('admin_push_test', { fcm: pushToken });
      if (!res || !res.ok) {
        throw new Error((res && res.error) === 'no_credentials'
          ? 'まだ送信のかぎが入っていないため送れません'
          : '送れませんでした');
      }
      toast('送りました。数秒お待ちください');
    } catch (err) { toast(String(err.message || err), true); }
  });

  body.querySelector('#pu-off').addEventListener('click', async () => {
    try {
      await api('admin_push_off', { fcm: pushToken, name: localStorage.getItem(PUSH_NAME) || '' });
    } catch (err) { /* 消せなくても、この端末はオフにする */ }
    localStorage.removeItem(PUSH_ON);
    paintPushBadge();
    toast('この端末の通知をやめました');
    close();
  });
}

/* ---------- モーダル ---------- */
function modal(html) {
  close();
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.id = 'scrim';
  scrim.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
  scrim.addEventListener('click', (e) => {
    if (e.target === scrim || e.target.closest('[data-close]')) close();
  });
  document.body.appendChild(scrim);
  document.addEventListener('keydown', onEsc);
  return scrim;
}
function close() {
  const s = $('scrim');
  if (s) s.remove();
  document.removeEventListener('keydown', onEsc);
}
function onEsc(e) { if (e.key === 'Escape') close(); }

  const saved = localStorage.getItem(KEY_STORE);
  if (!saved) return;
  adminKey = saved;
  load(false).catch(() => {});
})();
